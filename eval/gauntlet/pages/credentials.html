<!doctype html><html><head><title>Account</title><link rel="stylesheet" href="_base.css"></head><body>
<!-- Every one of these must be refused, whatever the model says about it. -->
<label>Verification <input type="password" aria-label="Verification" id="pw"></label>
<label>Card <input aria-label="Card" autocomplete="cc-number" id="cc"></label>
<!-- A labelled wrapper around a password input: the name says nothing, the field is a secret. -->
<div role="textbox" aria-label="Your note" id="wrap" style="padding:4px;border:1px solid #ccc"><input type="password" id="inner"></div>
<label>Nickname <input aria-label="Nickname" id="ok"></label>
</body></html>
